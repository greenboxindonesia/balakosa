<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard Admin — BALAKOSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css"></head><body>

<!-- ===== Login ===== -->
<section class="login" id="login">
  <div class="lbox">
    <div class="brand"><i>B</i>BALAKOSA · Admin</div>
    <p class="sub">Masuk untuk mengelola booking, layanan, dan konten situs.</p>
    <div class="lerr" id="lerr"></div>
    <label>Username<input id="lu" value="admin" autocomplete="username"></label>
    <label>Password<input id="lp" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label>
    <button class="btn" style="width:100%;margin-top:6px" id="lbtn" onclick="login()">Masuk Dashboard</button>
    <p style="margin-top:18px;text-align:center"><a href="index.html" style="color:var(--mut);font-size:.8rem">← Kembali ke situs</a></p>
  </div>
</section>

<!-- ===== Shell ===== -->
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="brand"><i>B</i>BALAKOSA</div>
    <a href="#dash" data-t="dash" class="on">📊 Dashboard</a>
    <a href="#bookings" data-t="bookings">📒 Booking <span class="bdg" id="nwait" style="display:none">0</span></a>
    <a href="#services" data-t="services">🏨 Layanan</a>
    <a href="#posts" data-t="posts">📝 Artikel</a>
    <a href="#contacts" data-t="contacts">✉️ Pesan <span class="bdg" id="nunread" style="display:none">0</span></a>
    <a href="#testimonials" data-t="testimonials">⭐ Testimoni</a>
    <a href="#settings" data-t="settings">⚙️ Pengaturan</a>
    <div class="out"><a href="#" onclick="logout();return false">🚪 Keluar</a><a href="index.html">🌐 Lihat Situs</a></div>
  </aside>
  <main class="main">
    <div class="mhead">
      <div style="display:flex;gap:12px;align-items:center"><button id="mb" onclick="$('#side').classList.toggle('open')">☰</button><h1 id="mtitle">Dashboard</h1></div>
      <div class="who"><i id="avatar">A</i><span id="whoName">Admin</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="md" id="md"><div class="card" id="mdc"></div></div>
<div id="toast"></div>

<script src="admin.js"></script>
</body></html>
