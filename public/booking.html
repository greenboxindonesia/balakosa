<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Booking hotel, penginapan, cottage, dan trip BALAKOSA langsung dari kalender.">
<title>BALAKOSA — Booking Hotel, Penginapan, Cottage & Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg"><link rel="icon" type="image/png" sizes="96x96" href="images/favicon/favicon-96x96.png"><link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png"><link rel="manifest" href="images/favicon/site.webmanifest"><link rel="stylesheet" href="css/style.css">
<style>
body{background:var(--soft)}

/* ---------- hero ---------- */
.bk-hero{position:relative;background-color:var(--bd);background:linear-gradient(160deg,#e9f1fe,#f6f9fd 55%,#fdf6ec);background-size:cover;background-position:center 35%;border-bottom:1px solid var(--ln);padding:120px 0 48px}
.bk-hero .chip{display:inline-flex;align-items:center;gap:8px;background:#fff;box-shadow:0 8px 18px -12px rgba(16,24,40,.45)}
.bk-hero .chip:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--b)}
.bk-hero h1{color:var(--bd);font-size:clamp(1.9rem,4vw,3rem);max-width:760px;margin-top:18px}
.bk-hero .lead{margin-top:16px;max-width:560px}
.bk-hero.has-img h1{color:#fff}
.bk-hero.has-img .lead{color:rgba(255,255,255,.9)}
.bk-hero.has-img .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bk-hero.has-img .chip:before{background:#fff}

/* ---------- layout ---------- */
.bk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start;padding:46px 0 70px}
.bk .card:hover{transform:none;box-shadow:var(--sh)}
.bk-main{padding:30px 32px}
.bk-sum{padding:26px}
.stk{position:sticky;top:90px}

/* ---------- step sections ---------- */
.sec{margin-top:32px;padding-top:28px;border-top:1px solid var(--ln)}
.sec:first-of-type{margin-top:0;padding-top:0;border-top:0}
.sec-head{display:flex;align-items:center;gap:12px;font-size:1rem}
.sec-head .n{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--b);color:#fff;font:800 12px Sora;display:grid;place-items:center}
.bk-sum h3{font-size:1.3rem;padding-bottom:14px;border-bottom:1px solid var(--ln);margin-bottom:16px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:18px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .pl{flex:0 0 auto;white-space:nowrap;margin:0}

/* ---------- info panel (layanan & pembayaran) ---------- */
.info{background:#f4f8ff;border:1px solid rgba(37,99,235,.16);border-radius:16px;padding:16px 18px;font-size:.86rem;line-height:1.55}
.info-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.info-name{display:inline-flex;align-items:center;gap:8px;font-family:Sora;font-weight:700;color:var(--bd)}
.info-price{margin-left:auto;font-family:Sora;font-weight:800;color:var(--b);font-size:1rem}
.info-price small{font-weight:600;color:var(--mut);font-size:.72rem}
.info-desc{margin:9px 0 0;color:var(--mut);font-size:.82rem}
.info-feats{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.info-feats .chip{margin:0;background:#fff;border:1px solid var(--ln);font-size:.72rem;padding:4px 10px;box-shadow:none}
.info-note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(37,99,235,.22);color:var(--mut);font-size:.78rem}
.info-note .icn{color:var(--b);flex:0 0 auto;margin-top:1px}

/* ---------- form ---------- */
input,select,textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:11px 13px;font:inherit;background:#fff;color:var(--ink);outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
label{display:block;font-size:13px;font-weight:600;color:var(--bd)}
label input,label select,label textarea{margin-top:6px;font-weight:400}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}

/* ---------- calendar (full width) ---------- */
#cal{width:100%}
.ch{display:flex;justify-content:space-between;align-items:center;margin:16px 0 14px;gap:10px}
.ch b{font-family:Sora;font-size:.95rem;text-transform:capitalize}
.ch button{border:0;background:var(--bs);color:var(--b);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;transition:.2s}
.ch button:hover{background:var(--sky)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.cg i{font-style:normal;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.d{height:50px;border:0;border-radius:11px;background:#fff;font:inherit;cursor:pointer;transition:.15s;font-weight:500;color:var(--ink)}
.d:hover:not(:disabled){background:var(--bs)}
.d:disabled{color:#c3cbdd;text-decoration:line-through;cursor:not-allowed;background:#f2f4f9}
.d.on{background:var(--b);color:#fff;font-weight:700}
.d.rg{background:var(--sky);color:var(--b)}

/* ---------- payment ---------- */
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 12px}
.po2{border:1.5px solid var(--ln);border-radius:14px;padding:13px 14px;cursor:pointer;background:#fff;font-size:13px;line-height:1.45;transition:.2s}
.po2 b{display:block;font-size:13px;margin-bottom:3px}
.po2:hover{border-color:var(--b)}
.po2.on{border-color:var(--b);background:var(--bs)}

/* ---------- summary ---------- */
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.row:last-child{border-bottom:0}
.row b{text-align:right}
.tot{font:700 20px Sora;color:var(--b)}

/* ---------- modal & toast ---------- */
.md{position:fixed;inset:0;background:rgba(11,42,107,.45);display:none;place-items:center;padding:18px;z-index:90;backdrop-filter:blur(4px)}
.md.s{display:grid}
.md .card{max-width:430px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--bd);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:calc(100% - 32px);text-align:center}
#toast.s{opacity:1;transform:translateX(-50%)}

@media(max-width:900px){
  .bk{grid-template-columns:minmax(0,1fr);gap:24px;padding:34px 0 60px}
  .stk{position:static;top:auto}
  .fg,.pay{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:640px){
  .bk-hero{padding:96px 0 34px}
  .bk-hero h1{font-size:1.6rem;margin-top:14px}
  .bk-main,.bk-sum{padding:22px 20px}
  .bk-sum h3{font-size:1.15rem;padding-bottom:12px}
  .sec{margin-top:26px;padding-top:22px}
  .sec-head{font-size:.94rem}
  .d{height:42px;border-radius:9px}
  .cg{gap:6px}
  .ch{margin:14px 0 10px}
  .ch button{width:32px;height:32px}
  .md .card{max-width:100%}
}
</style></head><body>
<div id="hd"></div>
<main id="pub">
<section class="bk-hero" id="bkhero"><div class="w">
<span class="chip">Hotel · Penginapan · Cottage · Trip</span>
<h1>Menginap &amp; berlibur, cukup pilih tanggalnya.</h1>
<p class="lead">Booking langsung dari kalender, konfirmasi cepat via WhatsApp.</p>
</div></section>

<section class="w"><div class="bk">
<div class="card bk-main">
<h3 class="sec-head"><span class="n">1</span> Pilih Layanan</h3>
<div class="tabs" id="stb"></div><div class="info" id="sd"></div>
<div class="sec"><h3 class="sec-head"><span class="n">2</span> Pilih Tanggal</h3><div id="cal"></div><p class="lead" id="dt" style="margin-top:12px;font-size:.85rem"></p></div>
<div class="sec"><h3 class="sec-head"><span class="n">3</span> Data Pemesan</h3><div class="fg">
<label>Nama lengkap<input id="nm" placeholder="Nama Anda" autocomplete="name"></label>
<label>No. WhatsApp<input id="wa" type="tel" placeholder="08xxxxxxxxxx" autocomplete="tel" inputmode="tel"></label>
<label>Jumlah tamu / peserta<input id="g" type="number" min="1" value="2" oninput="sum()"></label>
<label>Catatan (opsional)<input id="note" placeholder="Permintaan khusus"></label></div></div>
<div class="sec"><h3 class="sec-head"><span class="n">4</span> Pembayaran</h3><div class="pay" id="pay"></div><div class="info" id="pi"></div></div>
</div>
<aside class="card stk bk-sum"><h3>Ringkasan Booking</h3><div id="sum"></div><button class="btn" style="width:100%;margin-top:18px" onclick="send()">Kirim Booking via WhatsApp</button><small style="display:block;margin-top:10px;text-align:center">Admin akan mengonfirmasi ketersediaan maksimal 1×24 jam.</small></aside>
</div></section>
</main>
<div id="ft"></div>

<div class="md" id="ok"><div class="card" id="okc"></div></div>
<div id="toast"></div>

<script src="js/icons.js"></script><script src="js/app.js"></script><script>
layout('booking');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>new Date(k+'T00:00'),fd=k=>pd(k).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const esc2=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const heroSrc=v=>!v?null:(/^https?:/i.test(v)?v:'https://images.unsplash.com/photo-'+v+'?auto=format&fit=crop&w=1800&q=70');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),2600)}

const PAY=[['dp','Transfer · DP','Kunci tanggal dengan DP, lunas saat check-in.'],['lunas','Transfer · Lunas','Bayar penuh sekarang.'],['qris','QRIS','Admin kirim kode QRIS via WhatsApp.'],['lokasi','Bayar di Lokasi','Tunai saat tiba, tanpa DP.']];
let svc='hotel',sel={s:null,e:null},pay='dp',cur=new Date();cur.setDate(1);
let bookedSet=new Set();

function applyHero(){const el=$('#bkhero'),u=heroSrc(SET.booking_hero_image)||heroSrc('1520250497591-112f2f40a3f4');
if(u){el.style.backgroundImage=`linear-gradient(115deg,rgba(9,25,48,.82),rgba(9,25,48,.46) 58%,rgba(9,25,48,.2)),url("${u}")`;el.style.backgroundSize='cover';el.classList.add('has-img')}
init()}
function init(){if(!SV.length)return setTimeout(init,120);
const pre=new URLSearchParams(location.search).get('svc');
if(pre&&SV.find(x=>x.slug==pre))svc=pre;
setSv(svc)}
function setSv(id){svc=id;sel={s:null,e:null};const s=SV.find(x=>x.slug==id);
$('#stb').innerHTML=SV.map(x=>`<button class="pl${x.slug==id?' on':''}" onclick="setSv('${x.slug}')">${ICN(cIk(x.slug),14)} ${x.name}</button>`).join('');
$('#sd').innerHTML=`<div class="info-top"><span class="info-name">${ICN(cIk(s.slug),16)} ${esc2(s.name)}</span><span class="info-price">${rp(s.price)}<small>/${esc2(s.unit)}</small></span></div>${s.description?`<p class="info-desc">${esc2(s.description)}</p>`:''}${(s.features&&s.features.length)?`<div class="info-feats">${s.features.map(x=>`<span class="chip">${esc2(x)}</span>`).join('')}</div>`:''}${s.rules?`<div class="info-note">${ICN('dokumen',15)}<span>${esc2(s.rules)}</span></div>`:''}`;
drawCal();payUI();sum()}
async function fetchBooked(){const m=iso(cur).slice(0,7);try{const r=await fetch(API+'/api/availability?service='+svc+'&month='+m);const d=await r.json();bookedSet=new Set(d.booked||[])}catch(e){bookedSet=new Set()}}
async function mv(n){cur.setMonth(cur.getMonth()+n);await fetchBooked();drawCal()}
async function drawCal(){await fetchBooked();
const y=cur.getFullYear(),m=cur.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=iso(new Date());
let h=`<div class="ch"><button type="button" onclick="mv(-1)">‹</button><b>${cur.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button type="button" onclick="mv(1)">›</button></div><div class="cg">`+['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<i>${x}</i>`).join('');
for(let i=0;i<f;i++)h+='<span></span>';
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),dis=k<t||bookedSet.has(k);
let c='d'+(dis?' x':'');if(k==sel.s||k==sel.e)c='d on';else if(sel.e&&k>sel.s&&k<sel.e)c='d rg';
h+=`<button type="button" class="${c}"${dis?' disabled':''} onclick="pick('${k}')">${d}</button>`}
$('#cal').innerHTML=h+'</div>'}
function pick(k){const s=SV.find(x=>x.slug==svc),tr=s&&s.unit=='orang';
if(tr||!sel.s||sel.e){sel={s:k,e:null}}else{let ok=k>sel.s,dd=sel.s;while(true){const d=new Date(dd+'T00:00');d.setDate(d.getDate()+1);dd=iso(d);if(dd>=k)break;if(bookedSet.has(dd)){ok=false;break}}sel=ok?{s:sel.s,e:k}:{s:k,e:null}}drawCal();sum()}
function payUI(){$('#pay').innerHTML=PAY.map(p=>`<div class="po2${p[0]==pay?' on':''}" onclick="pay='${p[0]}';payUI();sum()"><b>${p[1]}</b>${p[0]=='dp'?'DP '+(SET.dp_percent||30)+'% untuk mengunci tanggal.':p[2]}</div>`).join('');
$('#pi').innerHTML=pay=='qris'?'Kode QRIS dikirim admin via WhatsApp setelah booking diterima.':pay=='lokasi'?'Bayar saat tiba. Booking tetap perlu dikonfirmasi admin.':'Transfer ke <b>'+esc2(SET.payment_info||'rekening admin')+'</b>. Kirim bukti transfer ke WhatsApp admin.'}
function calc(){const s=SV.find(x=>x.slug==svc),g=Math.max(1,+$('#g').value||1),tr=s.unit=='orang',n=tr?1:(sel.s&&sel.e?Math.round((pd(sel.e)-pd(sel.s))/864e5):0),tot=tr?s.price*g:s.price*n;
const dp=+(SET.dp_percent||30);
return{s,g,n,tot,tr,dp,due:pay=='dp'?Math.round(tot*dp/100):pay=='lokasi'?0:tot}}
function sum(){const c=calc();if(!c)return;
const dt=!sel.s?(c.tr?'Pilih tanggal keberangkatan':'Pilih tanggal check-in'):c.tr?fd(sel.s):fd(sel.s)+(sel.e?' → '+fd(sel.e)+' ('+c.n+' malam)':' → pilih check-out');
$('#dt').textContent=dt;
$('#sum').innerHTML=`<div class="row"><span>Layanan</span><b>${c.s.name}</b></div><div class="row"><span>Tanggal</span><b>${dt}</b></div><div class="row"><span>Tamu</span><b>${c.g} orang</b></div><div class="row"><span>Harga</span><b>${rp(c.s.price)}/${c.s.unit}</b></div><div class="row"><span>Total</span><span class="tot">${rp(c.tot)}</span></div><div class="row"><span>Dibayar sekarang</span><b>${rp(c.due)}</b></div>`}
async function send(){const c=calc(),v=id=>$('#'+id).value.trim();
if(!sel.s||(!c.tr&&!sel.e))return toast('Pilih tanggal terlebih dulu');
if(!v('nm')||v('wa').replace(/\D/g,'').length<9)return toast('Lengkapi nama & nomor WhatsApp');
const b=event.target;b.disabled=true;b.textContent='Mengirim…';
try{
const r=await fetch(API+'/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:svc,name:v('nm'),phone:v('wa'),guests:+$('#g').value||1,checkin:sel.s,checkout:sel.e||sel.s,payment_method:pay,notes:v('note')})});
const d=await r.json();
if(!r.ok){toast(d.error||'Gagal menyimpan booking');b.disabled=false;b.textContent='Kirim Booking via WhatsApp';return}
const pm=PAY.find(p=>p[0]==pay)[1];
const t=`*BOOKING BARU BALAKOSA*\nID: ${d.code}\nLayanan: ${d.serviceName}\nTanggal: ${d.message}\nTamu: ${v('nm')} (${d.g||''}${$('#g').value})\nWA: ${v('wa')}\nTotal: ${d.priceLabel}`;
open('https://wa.me/'+WA+'?text='+encodeURIComponent(t),'_blank');
$('#okc').innerHTML=`<div style="margin-bottom:10px;color:var(--ok)">${ICN('check',30)}</div><h3>Booking Terkirim</h3><p>ID booking: <b>${d.code}</b></p><p class="lead" style="margin:8px 0 16px;font-size:.88rem">Pesanan dikirim ke WhatsApp admin. ${pay=='lokasi'?'Tunggu konfirmasi ketersediaan.':pay=='qris'?'Admin akan mengirim kode QRIS.':'Transfer ke '+esc2(SET.payment_info||'rekening admin')+' lalu kirim bukti bayar.'}</p><button class="btn" onclick="$('#ok').classList.remove('s')">Tutup</button>`;
$('#ok').classList.add('s');sel={s:null,e:null};drawCal();sum();
}catch(e){toast('Gagal terhubung ke server. Coba lagi.')}
b.disabled=false;b.textContent='Kirim Booking via WhatsApp'}
load().then(applyHero);
</script></body></html>
